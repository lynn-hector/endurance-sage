# 环境矩阵 —— 唯一需要手工维护的环境定义文件。
#
# 每行环境 = 一组数据源 endpoint + 凭据键名（引用，不是值）。
# 值放 ~/.dsh/.credentials.yaml（键名即此处的 *Ref 字段）。
# use-env 切换前按腿校验凭据值是否就绪；缺值或空值只降级该腿并告警，不拦截切换（补值即恢复）。
#
# 环境命名与运维环境标识一致（本文件即权威环境矩阵）；凭据键短码：
#   DP0=dev-platform-hosted-0, DP1=dev-platform-hosted-1, DC0=dev-client-hosted-0，
#   TP0=tst-platform-hosted-0, TP1=tst-platform-hosted-1, TC0=tst-client-hosted-0，
#   SC1=sit-client-hosted-1, SC2=sit-client-hosted-2,
#   PBO=pro-br-saas-aws-eks-novo, TPSG0=tst-platform-aws-eks-sg-0,
#   PUO=pro-use-saas-aws-eks-novo, PZO=pro-za-saas-aws-eks-novo,
#   PDO=pro-de-saas-aws-eks-novo, PSO=pro-sg-saas-aws-eks-novo,
#   TPDE0=tst-platform-aws-eks-de-0, TPUS0=tst-platform-aws-eks-us-0, TPAU0=tst-platform-aws-eks-au-0
# - dev-platform-hosted-0/1  研发-平台托管 cn-0/cn-1.dev.novo-one.com
# - dev-client-hosted-0      研发-客户自托管 cn-0.dev-byoi.novo-one.com
# - tst-platform-hosted-0/1  测试-平台托管 cn-0/cn-1.test.novo-one.com
# - tst-client-hosted-0      测试-客户自托管 cn-0.test-byoi.novo-one.com
# - sit-client-hosted-1/2    性能-客户自托管 cn-1/cn-2.sit-byoi.novo-one.com
# - pro-br-saas-aws-eks-novo   生产-平台自营-亚马逊云-EKS-巴西-0 br.novoone.com
# - tst-platform-aws-eks-sg-0  新加坡-测试0自营环境 sg-0.pre.novo-one.com
# - pro-use-saas-aws-eks-novo  生产-平台自营-亚马逊云-EKS-美国东部-0 use.novoone.com
# - pro-za-saas-aws-eks-novo   生产-平台自营-亚马逊云-EKS-南非-0 za.novoone.com
# - pro-de-saas-aws-eks-novo   生产-平台自营-亚马逊云-EKS-德国-0 de.novoone.com
# - pro-sg-saas-aws-eks-novo   生产-平台自营-亚马逊云-EKS-新加坡-0 sg.novoone.com
# - tst-platform-aws-eks-de-0  德国-测试0自营环境-法兰克福 de-0.pre.novo-one.com
# - tst-platform-aws-eks-us-0  美国-测试0自营环境-俄勒冈州 us-0.pre.novo-one.com
# - tst-platform-aws-eks-au-0  澳大利亚-测试0自营环境 au-0.pre.novo-one.com
#
# 已实测的凭据事实（tst 三环境 2026-09-02 全腿 probe 通过）：
# - greptimedb 三环境同凭据（grafana 用户，键 GREPTIMEDB_DP0_USERNAME/PASSWORD），CSV 中该块为陈旧值
# - grafana 每环境独立密码（admin）；tst 三实例（及 DC0）禁用 basic auth：trace 与 prometheus 均走
#   表单登录+cookie 不受影响（2026-09-02 起 prometheus 腿统一为表单登录，不再需要 service account token）
# - dbx / rocketmq：每环境独立 endpoint 与凭据键
# - zadig 为平台级（唯一）
# - zadig 用长期 OpenAPI token（ZADIG_API_TOKEN，Zadig 个人设置创建，不过期）；不要用浏览器复制的 dex 会话 token（约 1h 过期）
# - alertmanager 数据源经 grafana 代理（dp1 实测 uid=alertmanager，2026-10-12）；复用 grafana 腿账密，envs 每环境无需另配
# - greptimedb 支持 token 模式：greptimedb 腿改配 tokenRef（值=纯 token，dashboard /#/token-generator
#   页面生成，AES 加密的账密），省略 usernameRef/passwordRef；服务端解密后仍走 Basic。
#   tokenRef 与账密引用二选一：tokenRef 定义时按 token 接线，渲染与预检都
#   忽略残留的账密引用（别同配两套）
#   用法（XX=环境短码）：
#     greptimedb:
#       endpoint: https://greptimedb.br.novoone.com
#       tokenRef: GREPTIMEDB_XX_CONNECT_TOKEN   # 值=纯 token（token-generator 生成的 base64url 串）

dev-platform-hosted-0:
  envLabel: dev-platform-hosted-0
  greptimedb:
    endpoint: https://greptimedb.cn-0.dev.novo-one.com
    database: public
    usernameRef: GREPTIMEDB_DP0_USERNAME
    passwordRef: GREPTIMEDB_DP0_PASSWORD
  grafana:
    endpoint: https://grafana.cn-0.dev.novo-one.com
    greptimedbJaegerDatasourceUid: GreptimeDB-Jaeger
    usernameRef: GRAFANA_DP0_USERNAME
    passwordRef: GRAFANA_DP0_PASSWORD
  prometheus:
    datasourceUid: prometheus   # 经 grafana 代理，endpoint 复用 grafana
  dbx:
    endpoint: https://dbx.cn-0.dev.novo-one.com
    passwordRef: DBX_DP0_PASSWORD
  rocketmq:
    endpoint: https://rocketmq.cn-0.dev.novo-one.com   # 每环境独立 console，登录实测通过
    usernameRef: ROCKETMQ_DP0_USERNAME
    passwordRef: ROCKETMQ_DP0_PASSWORD
  zadig:
    endpoint: https://zadig.yeastardigital.com
    project: novo-one-helm-charts-project
