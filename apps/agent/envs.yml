# 环境矩阵 —— 唯一需要手工维护的环境定义文件。
#
# 每行环境 = 一组数据源 endpoint + 凭据键名（引用，不是值）。
# 值放 ~/.dsh/.credentials.yaml（键名即此处的 *Ref 字段）。
# use-env 切换前会校验该环境全部凭据键是否就绪，缺任何一个都拒绝切换，
# 所以"补齐凭据的进度"就是"环境启用的进度"。
#
# 约定：
# - credentials 键名沿用原项目 .env.example 的 <SYSTEM>_<ENV>_<FIELD> 命名。
# - [待补] 标记的字段是没有确证值的占位，拿到真实值后替换。

local:
  envLabel: local
  greptimedb:
    endpoint: https://greptimedb.cn-0.dev.novo-one.com
    database: public
    usernameRef: GREPTIMEDB_LOCAL_USERNAME
    passwordRef: GREPTIMEDB_LOCAL_PASSWORD
  grafana:
    endpoint: https://grafana.cn-0.dev.novo-one.com
    datasourceUid: GreptimeDB-Jaeger
    usernameRef: GRAFANA_LOCAL_USERNAME
    passwordRef: GRAFANA_LOCAL_PASSWORD
  prometheus:
    datasourceUid: prometheus   # 经 grafana 代理，endpoint 复用 grafana
  dbx:
    endpoint: https://dbx.cn-0.dev.novo-one.com
    passwordRef: DBX_PASSWORD
  rocketmq:
    endpoint: https://rocketmq.cn-0.test.novo-one.com   # console 只在 test 域
    usernameRef: ROCKETMQ_LOCAL_USERNAME
    passwordRef: ROCKETMQ_LOCAL_PASSWORD
  zadig:
    endpoint: https://zadig.yeastardigital.com
    project: novo-one-helm-charts-project
    envName: dev-client-hosted-0
    tokenRef: ZADIG_DEX_TOKEN   # dex 会话 token，约 1h 过期，从浏览器刷新

test:
  envLabel: test
  greptimedb:
    endpoint: https://greptimedb.cn-0.test.novo-one.com   # [待补] 按域名惯例推断
    database: public
    usernameRef: GREPTIMEDB_TEST_USERNAME
    passwordRef: GREPTIMEDB_TEST_PASSWORD
  grafana:
    endpoint: https://grafana.cn-0.test.novo-one.com   # [待补] 按域名惯例推断
    datasourceUid: GreptimeDB-Jaeger
    usernameRef: GRAFANA_TEST_USERNAME
    passwordRef: GRAFANA_TEST_PASSWORD
  prometheus:
    datasourceUid: prometheus
  dbx:
    endpoint: https://dbx.cn-0.test.novo-one.com   # [待补] 按域名惯例推断
    passwordRef: DBX_TEST_PASSWORD
  rocketmq:
    endpoint: https://rocketmq.cn-0.test.novo-one.com
    usernameRef: ROCKETMQ_LOCAL_USERNAME   # 同一 console，账号复用；不同则改键名
    passwordRef: ROCKETMQ_LOCAL_PASSWORD
  zadig:
    endpoint: https://zadig.yeastardigital.com
    project: novo-one-helm-charts-project
    envName: tst-platform-hosted-0   # [待补] 对应部署文档的测试环境标识，需在 Zadig 确认
    tokenRef: ZADIG_DEX_TOKEN

