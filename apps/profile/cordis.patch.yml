# dsh-sentry 组装（env: tst-platform-hosted-1）——由 apps/agent/envs.yml 生成，勿手改。
# 手工维护入口：apps/agent/envs.yml；重新生成：pnpm --filter @dsh-sentry/agent run regenerate
# 顺序即依赖顺序：数据源 service 先于其 tool；凭据全部走引用，不出现明文密码。

- insert:
    - id: sentry-tool-env-switcher
      name: '@dsh-sentry/tool-env-switcher'
      config:
        env: tst-platform-hosted-1
    - id: sentry-greptimedb
      name: '@dsh-sentry/service-greptimedb'
      config:
        endpoint: https://greptimedb.cn-1.test.novo-one.com
        database: public
        usernameRef: GREPTIMEDB_TP1_USERNAME
        passwordRef: GREPTIMEDB_TP1_PASSWORD
    - id: sentry-tool-log-analyzer
      name: '@dsh-sentry/tool-log-analyzer'
      config:
        env: tst-platform-hosted-1
    - id: sentry-trace
      name: '@dsh-sentry/service-trace'
      config:
        mode: grafana-jaeger
        endpoint: https://grafana.cn-1.test.novo-one.com
        usernameRef: GRAFANA_TP1_USERNAME
        passwordRef: GRAFANA_TP1_PASSWORD
    - id: sentry-tool-trace-analyzer
      name: '@dsh-sentry/tool-trace-analyzer'
      config:
        env: tst-platform-hosted-1
        datasourceUid: PCD48328C06B18945
    - id: sentry-prometheus
      name: '@dsh-sentry/service-prometheus'
      config:
        grafanaEndpoint: https://grafana.cn-1.test.novo-one.com
        datasourceUid: prometheus
        tokenRef: PROMETHEUS_TP1_TOKEN
    - id: sentry-tool-metrics-inspector
      name: '@dsh-sentry/tool-metrics-inspector'
      config:
        env: tst-platform-hosted-1
    - id: sentry-dbx
      name: '@dsh-sentry/service-dbx'
      config:
        endpoint: https://dbx.cn-1.test.novo-one.com
        passwordRef: DBX_TP1_PASSWORD
    - id: sentry-tool-db-inspector
      name: '@dsh-sentry/tool-db-inspector'
      config:
        env: tst-platform-hosted-1
        database: novo_commctl_config
    - id: sentry-tool-redis-inspector
      name: '@dsh-sentry/tool-redis-inspector'
      config:
        env: tst-platform-hosted-1
    - id: sentry-zadig
      name: '@dsh-sentry/service-zadig'
      config:
        endpoint: https://zadig.yeastardigital.com
        project: novo-one-helm-charts-project
        envName: tst-platform-hosted-1
        tokenRef: ZADIG_API_TOKEN
    - id: sentry-tool-zadig-inspector
      name: '@dsh-sentry/tool-zadig-inspector'
      config:
        env: tst-platform-hosted-1
    - id: sentry-service-rocketmq
      name: '@dsh-sentry/service-rocketmq'
      config:
        endpoint: https://rocketmq.cn-1.test.novo-one.com
        usernameRef: ROCKETMQ_TP1_USERNAME
        passwordRef: ROCKETMQ_TP1_PASSWORD
    - id: sentry-tool-mq-inspector
      name: '@dsh-sentry/tool-mq-inspector'
      config:
        env: tst-platform-hosted-1
    - id: sentry-tapd
      name: '@dsh-sentry/service-tapd'
      config:
        workspaceId: "63822673"
        tokenRef: TAPD_TOKEN
    - id: sentry-tool-tapd-inspector
      name: '@dsh-sentry/tool-tapd-inspector'
      config:
        env: tst-platform-hosted-1
    - id: sentry-tool-code-repository
      name: '@dsh-sentry/tool-code-repository'
      config:
        env: tst-platform-hosted-1
        baseDir: /Users/yangfm/workspace/work/novo-one/novo-commctl
    - id: sentry-persona
      name: '@dsh-sentry/sentry-persona'
    - id: sentry-skills
      name: '@dsh-sentry/sentry-skills'
    - id: sentry-git-guard
      name: '@dsh-sentry/guard-git'
