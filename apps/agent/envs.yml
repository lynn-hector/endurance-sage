# 环境矩阵 —— 唯一需要手工维护的环境定义文件。
#
# 每行环境 = 一组数据源 endpoint + 凭据键名（引用，不是值）。
# 值放 ~/.dsh/.credentials.yaml（键名即此处的 *Ref 字段）。
# use-env 切换前会校验该环境全部凭据键是否就绪，缺任何一个都拒绝切换。
#
# 环境命名与运维环境标识一致（本文件即权威环境矩阵）；凭据键短码：
#   DP0=dev-platform-hosted-0, DP1=dev-platform-hosted-1, DC0=dev-client-hosted-0，
#   TP0=tst-platform-hosted-0, TP1=tst-platform-hosted-1, TC0=tst-client-hosted-0
# - dev-platform-hosted-0/1  研发-平台托管 cn-0/cn-1.dev.novo-one.com
# - dev-client-hosted-0      研发-客户自托管 cn-0.dev-byoi.novo-one.com
# - tst-platform-hosted-0/1  测试-平台托管 cn-0/cn-1.test.novo-one.com
# - tst-client-hosted-0      测试-客户自托管 cn-0.test-byoi.novo-one.com
#
# 已实测的凭据事实（tst 三环境 2026-09-02 全腿 probe 通过）：
# - greptimedb 三环境同凭据（grafana 用户，键 GREPTIMEDB_DP0_USERNAME/PASSWORD），CSV 中该块为陈旧值
# - grafana 每环境独立密码（admin）；tst 三实例禁用 basic auth：trace 走表单登录+cookie 不受影响，
#   prometheus 走 service account Bearer token（prometheus.tokenRef = PROMETHEUS_<TP0|TP1|TC0>_TOKEN）
# - dbx / rocketmq：每环境独立 endpoint 与凭据键
# - zadig 为平台级（唯一）
# - zadig 用长期 OpenAPI token（ZADIG_API_TOKEN，Zadig 个人设置创建，不过期）；不要用浏览器复制的 dex 会话 token（约 1h 过期）

dev-platform-hosted-0:
  envLabel: dev-platform-hosted-0
  greptimedb:
    endpoint: https://greptimedb.cn-0.dev.novo-one.com
    database: public
    usernameRef: GREPTIMEDB_DP0_USERNAME
    passwordRef: GREPTIMEDB_DP0_PASSWORD
  grafana:
    endpoint: https://grafana.cn-0.dev.novo-one.com
    datasourceUid: GreptimeDB-Jaeger
    usernameRef: GRAFANA_DP0_USERNAME
    passwordRef: GRAFANA_DP0_PASSWORD
  prometheus:
    datasourceUid: prometheus   # 经 grafana 代理，endpoint 复用 grafana
  dbx:
    endpoint: https://dbx.cn-0.dev.novo-one.com
    passwordRef: DBX_DP0_PASSWORD
  rocketmq:
    endpoint: https://rocketmq.cn-0.dev.novo-one.com   # 每环境独立 console，登录实测通过
    usernameRef: ROCKETMQ_DP0_USERNAME
    passwordRef: ROCKETMQ_DP0_PASSWORD
  zadig:
    endpoint: https://zadig.yeastardigital.com
    project: novo-one-helm-charts-project
    envName: dev-platform-hosted-0
    tokenRef: ZADIG_API_TOKEN

dev-platform-hosted-1:
  envLabel: dev-platform-hosted-1
  greptimedb:
    endpoint: https://greptimedb.cn-1.dev.novo-one.com
    database: public
    usernameRef: GREPTIMEDB_DP1_USERNAME   # 值与 DP0 相同（实测），独立成键便于将来分叉
    passwordRef: GREPTIMEDB_DP1_PASSWORD
  grafana:
    endpoint: https://grafana.cn-1.dev.novo-one.com
    datasourceUid: PCD48328C06B18945   # Jaeger 数据源 uid 随环境漂移（DP0 恰为 GreptimeDB-Jaeger）
    usernameRef: GRAFANA_DP1_USERNAME
    passwordRef: GRAFANA_DP1_PASSWORD        # 来自环境清单，已实测 200
  prometheus:
    datasourceUid: prometheus
  dbx:
    endpoint: https://dbx.cn-1.dev.novo-one.com
    passwordRef: DBX_DP1_PASSWORD
  rocketmq:
    endpoint: https://rocketmq.cn-1.dev.novo-one.com   # 每环境独立 console，登录实测通过
    usernameRef: ROCKETMQ_DP1_USERNAME   # 值与 DP0 相同（实测）
    passwordRef: ROCKETMQ_DP1_PASSWORD
  zadig:
    endpoint: https://zadig.yeastardigital.com
    project: novo-one-helm-charts-project
    envName: dev-platform-hosted-1
    tokenRef: ZADIG_API_TOKEN

