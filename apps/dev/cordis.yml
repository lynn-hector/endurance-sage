# Phase 0/2 declarative composition, loaded by `tsx src/bin-loader.ts` through
# the Cordis loader: plugin names resolve via Node resolution from this file's
# directory.
#
# 证据 Provider 不再全局装配：Session 环境栈（env-binding + env-provider）按
# 各 Session 绑定从 envs.yml（defaultEnvsPath）懒创建 Provider。本宿主只验证
# 注册，不发起查询。

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: skills
  name: '@deepseek-ai/dsh-skill'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-projections
  name: '@deepseek-ai/dsh-session-projection'

- id: sentry
  name: '@dsh-sentry/sentry'
  config:
    defaultEnv: dev-platform-hosted-0
