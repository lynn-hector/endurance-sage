stages:
  - verify
  - release

default:
  image: node:24-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ripgrep
    - corepack enable
    - corepack prepare pnpm@11.22.0 --activate

verify:
  stage: verify
  script:
    - pnpm install --frozen-lockfile
    - node scripts/sync-release.ts --check
    - pnpm run verify
    - pnpm run release:pack
  artifacts:
    expire_in: 1 day
    paths:
      - output/npm/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

publish-npm:
  stage: release
  script:
    - pnpm run release:publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/'
