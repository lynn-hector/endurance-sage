# Phase 0/2 declarative composition, loaded by `tsx src/bin-loader.ts` through
# the Cordis loader: plugin names resolve via Node resolution from this file's
# directory.

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: skills
  name: '@deepseek-ai/dsh-skill'

- id: sentry-hello
  name: '@dsh-sentry/tool-hello'
  config:
    greeting: 'hello from cordis.yml'

# Placeholder endpoint: the dev host verifies registration only, it never
# queries. Real environments override via settings or an env-specific patch.
- id: sentry-greptimedb
  name: '@dsh-sentry/service-greptimedb'
  config:
    endpoint: https://greptimedb.example.invalid
    usernameRef: GREPTIMEDB_LOCAL_USERNAME
    passwordRef: GREPTIMEDB_LOCAL_PASSWORD

- id: sentry-tool-log-analyzer
  name: '@dsh-sentry/tool-log-analyzer'
  config:
    env: local

- id: sentry-trace
  name: '@dsh-sentry/service-trace'
  config:
    mode: grafana-jaeger
    endpoint: https://grafana.example.invalid
    usernameRef: GRAFANA_LOCAL_USERNAME
    passwordRef: GRAFANA_LOCAL_PASSWORD

- id: sentry-tool-trace-analyzer
  name: '@dsh-sentry/tool-trace-analyzer'
  config:
    env: local
    datasourceUid: GreptimeDB-Jaeger

- id: sentry-prometheus
  name: '@dsh-sentry/service-prometheus'
  config:
    endpoint: http://prometheus.example.invalid

- id: sentry-tool-metrics-inspector
  name: '@dsh-sentry/tool-metrics-inspector'
  config:
    env: local

- id: sentry-dbx
  name: '@dsh-sentry/service-dbx'
  config:
    endpoint: https://dbx.example.invalid
    passwordRef: DBX_REDIS_PASSWORD

- id: sentry-tool-db-inspector
  name: '@dsh-sentry/tool-db-inspector'
  config:
    env: local
    database: novo_commctl_config

- id: sentry-tool-redis-inspector
  name: '@dsh-sentry/tool-redis-inspector'
  config:
    env: local

- id: sentry-zadig
  name: '@dsh-sentry/service-zadig'
  config:
    endpoint: https://zadig.example.invalid
    project: novo-one
    envName: dev-env

- id: sentry-tool-zadig-inspector
  name: '@dsh-sentry/tool-zadig-inspector'
  config:
    env: local
